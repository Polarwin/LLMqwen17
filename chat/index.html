<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3 Chat</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-hover: #1d212b; --border: #262b36;
    --user: #2563eb; --text: #e5e7eb; --dim: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, sans-serif;
    height: 100dvh; overflow: hidden;
  }
  .app { display: flex; height: 100%; }

  /* ---- sidebar: historic chats ---- */
  #sidebar {
    width: 260px; flex: 0 0 260px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    transition: width .15s ease, flex-basis .15s ease, border-color .15s ease;
  }
  #sidebar.collapsed { width: 0; flex-basis: 0; border-color: transparent; }
  .sidebar-header { padding: 10px; border-bottom: 1px solid var(--border); }
  #new-chat {
    width: 100%; text-align: left; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
    cursor: pointer; font: inherit; font-weight: 600; white-space: nowrap;
  }
  #new-chat:hover { border-color: var(--dim); }
  #chat-list { flex: 1; overflow-y: auto; padding: 6px; }
  .chat-item {
    display: flex; align-items: center; gap: 6px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .chat-item:hover { background: var(--panel-hover); }
  .chat-item.active { background: var(--panel); }
  .chat-item .title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px;
  }
  .chat-item .del {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 4px;
    opacity: .5;
  }
  .chat-item .del:hover { opacity: 1; color: #fca5a5; }

  /* ---- main chat window ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  #toggle-sidebar {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 14px;
    flex: 0 0 auto;
  }
  #toggle-sidebar:hover { border-color: var(--dim); }
  header h1 {
    font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  header .model { color: var(--dim); font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; margin-left: auto; flex: 0 0 auto; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
  button:hover { border-color: var(--dim); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 12px; }
  .empty { margin: auto; color: var(--dim); font-size: 14px; }
  .msg { max-width: 820px; padding: 10px 14px; border-radius: 12px;
    white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff;
    border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel);
    border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot.error { border-color: #b91c1c; color: #fca5a5; }
  .msg .think { color: var(--dim); font-size: 13px; font-style: italic; }
  .cursor::after { content: "▊"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  form { display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--border); }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font: inherit; max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--dim); }
  #send { background: var(--user); border: none; color: #fff; font-weight: 600; }
  #send:disabled { opacity: .5; cursor: default; }
  #stop { display: none; background: #b91c1c; border: none; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <button id="new-chat">+ New chat</button>
    </div>
    <div id="chat-list"></div>
  </aside>
  <div class="main">
    <header>
      <button id="toggle-sidebar" title="Toggle chat list">☰</button>
      <h1 id="chat-title">New chat</h1>
      <span class="model" id="model-name">connecting…</span>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button type="submit" id="send">Send</button>
      <button type="button" id="stop">Stop</button>
    </form>
  </div>
</div>
<script>
const API = '/llm/v1/chat/completions';
const STORE_KEY = 'qwenChat.conversations';
const ACTIVE_KEY = 'qwenChat.activeId';
const COLLAPSED_KEY = 'qwenChat.sidebarCollapsed';

const sidebar = document.getElementById('sidebar');
const chatList = document.getElementById('chat-list');
const chatTitle = document.getElementById('chat-title');
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
let model = 'Qwen3-1.7B';
let controller = null;
let busy = false;

// ---- persistence ----
function loadChats() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    if (Array.isArray(raw) && raw.length) return raw;
  } catch {}
  return [];
}
function saveChats() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(chats)); } catch {}
}
function saveActiveId() {
  try { localStorage.setItem(ACTIVE_KEY, activeId); } catch {}
}

let chats = loadChats();
let activeId = null;
try { activeId = localStorage.getItem(ACTIVE_KEY); } catch {}
if (!chats.length) chats = [newChatObj()];
if (!activeId || !chats.some(c => c.id === activeId)) activeId = chats[0].id;

function newChatObj() {
  return { id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    title: 'New chat', messages: [] };
}
function getActiveChat() { return chats.find(c => c.id === activeId); }

// ---- sidebar ----
function renderSidebar() {
  chatList.innerHTML = '';
  for (const c of chats) {
    const item = document.createElement('div');
    item.className = 'chat-item' + (c.id === activeId ? ' active' : '');
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = c.title;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = 'Delete chat';
    del.addEventListener('click', e => { e.stopPropagation(); deleteChat(c.id); });
    item.append(title, del);
    item.addEventListener('click', () => switchChat(c.id));
    chatList.appendChild(item);
  }
}

function switchChat(id) {
  if (busy) return;
  activeId = id;
  saveActiveId();
  renderSidebar();
  renderLog();
}

function deleteChat(id) {
  if (busy) return;
  chats = chats.filter(c => c.id !== id);
  if (!chats.length) chats = [newChatObj()];
  if (activeId === id) activeId = chats[0].id;
  saveChats();
  saveActiveId();
  renderSidebar();
  renderLog();
}

document.getElementById('new-chat').addEventListener('click', () => {
  if (busy) return;
  const c = newChatObj();
  chats.unshift(c);
  activeId = c.id;
  saveChats();
  saveActiveId();
  renderSidebar();
  renderLog();
  input.focus();
});

function setSidebarCollapsed(collapsed) {
  sidebar.classList.toggle('collapsed', collapsed);
  try { localStorage.setItem(COLLAPSED_KEY, collapsed ? '1' : '0'); } catch {}
}
document.getElementById('toggle-sidebar').addEventListener('click', () => {
  setSidebarCollapsed(!sidebar.classList.contains('collapsed'));
});
{
  let collapsed = false;
  try { collapsed = localStorage.getItem(COLLAPSED_KEY) === '1'; } catch {}
  if (!collapsed && window.innerWidth < 700) collapsed = true; // sane default on small screens
  setSidebarCollapsed(collapsed);
}

// ---- chat window ----
function renderLog() {
  const chat = getActiveChat();
  chatTitle.textContent = chat.title;
  log.innerHTML = '';
  if (!chat.messages.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'Say something to get started.';
    log.appendChild(p);
    return;
  }
  for (const m of chat.messages) {
    const div = addRawMsg(m.role === 'user' ? 'user' : 'bot');
    renderContent(div, m.content);
  }
  log.scrollTop = log.scrollHeight;
}

function addRawMsg(role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

// Render text into a bubble, dimming Qwen3 <think> blocks.
function renderContent(bubble, text) {
  bubble.innerHTML = '';
  const parts = text.split(/(<think>[\s\S]*?(?:<\/think>|$))/);
  for (const p of parts) {
    if (p.startsWith('<think>')) {
      const s = document.createElement('span');
      s.className = 'think';
      s.textContent = p.replace(/<\/?think>/g, '');
      bubble.appendChild(s);
    } else if (p) {
      bubble.appendChild(document.createTextNode(p));
    }
  }
  log.scrollTop = log.scrollHeight;
}

fetch('/llm/v1/models').then(r => r.json()).then(d => {
  model = d.data[0].id;
  document.getElementById('model-name').textContent = model;
}).catch(() => {
  document.getElementById('model-name').textContent = 'server unreachable';
});

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  stopBtn.style.display = v ? '' : 'none';
  input.disabled = v;
  if (!v) input.focus();
}

async function send(text) {
  const chat = getActiveChat();
  const wasEmpty = chat.messages.length === 0;
  chat.messages.push({ role: 'user', content: text });
  if (wasEmpty) chat.title = text.length > 42 ? text.slice(0, 42) + '…' : text;
  saveChats();
  renderSidebar();
  addRawMsg('user').textContent = text;
  const bubble = addRawMsg('bot');
  bubble.classList.add('cursor');
  chatTitle.textContent = chat.title;
  setBusy(true);
  controller = new AbortController();
  let reply = '';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: chat.messages, stream: true }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (payload === '[DONE]') continue;
        const delta = JSON.parse(payload).choices?.[0]?.delta;
        if (delta?.content) { reply += delta.content; renderContent(bubble, reply); }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      bubble.classList.add('error');
      reply += (reply ? '\n\n' : '') + '⚠ ' + e.message;
      renderContent(bubble, reply);
    }
  } finally {
    bubble.classList.remove('cursor');
    setBusy(false);
    controller = null;
    if (reply) {
      chat.messages.push({ role: 'assistant', content: reply });
      saveChats();
    }
  }
}

renderSidebar();
renderLog();

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = '';
  input.style.height = 'auto';
  send(text);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
stopBtn.addEventListener('click', () => controller?.abort());
</script>
</body>
</html>
